<h1>SLOTS</h1>

<h2>{{ message }}</h2>

<div class="slots">

    <div class="slot" id="slot1">
    {{ slot1 }}
</div>

<div class="slot" id="slot2">
    {{ slot2 }}
</div>

<div class="slot" id="slot3">
    {{ slot3 }}
</div>
</div>

<button onclick="startSlots()">
    START
</button>

<button onclick="stopSlots()">
    STOP
</button>

<script>

let interval = null;

function startSlots() {

    const symbols = [
        "🍒",
        "🍋",
        "🔔",
        "⭐",
        "💎"
    ];

    const slot1 = document.getElementById("slot1");
    const slot2 = document.getElementById("slot2");
    const slot3 = document.getElementById("slot3");

    if (interval !== null) {
        return;
    }

    interval = setInterval(() => {

        slot1.innerHTML =
            symbols[Math.floor(Math.random() * symbols.length)];

        slot2.innerHTML =
            symbols[Math.floor(Math.random() * symbols.length)];

        slot3.innerHTML =
            symbols[Math.floor(Math.random() * symbols.length)];

    }, 100);
}

function stopSlots() {

    clearInterval(interval);

    interval = null;

    window.location.href =
        "{% url 'spin_slots' %}";
}

</script>
